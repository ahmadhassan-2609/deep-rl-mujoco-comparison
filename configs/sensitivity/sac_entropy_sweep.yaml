# SAC entropy coefficient sensitivity sweep
# Tests auto-tuning vs fixed alpha values
# When auto_tune_alpha=false, initial_alpha is used as the fixed alpha throughout training

algo: sac
sweep_param: initial_alpha
# Note: the run_sensitivity.py script will set auto_tune_alpha=false for all non-auto configs
# Configs: [auto-tune, fixed=0.1, fixed=0.5, fixed=1.0]
sweep_values: ["auto", 0.1, 0.5, 1.0]

hidden_dims: [256, 256]
learning_rate: 3.0e-4
gamma: 0.99
tau: 0.005
batch_size: 256
buffer_size: 1000000
learning_starts: 5000
total_timesteps: 1000000
eval_freq: 10000
eval_episodes: 10
