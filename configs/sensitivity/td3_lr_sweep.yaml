# TD3 learning rate sensitivity sweep
# Tests how sensitive TD3 is to the learning rate choice

algo: td3
sweep_param: learning_rate
sweep_values: [1.0e-4, 3.0e-4, 1.0e-3]

# Base config (everything else stays at default)
hidden_dims: [256, 256]
gamma: 0.99
tau: 0.005
batch_size: 256
buffer_size: 1000000
learning_starts: 25000
exploration_noise: 0.1
target_noise: 0.2
target_noise_clip: 0.5
policy_delay: 2
total_timesteps: 1000000
eval_freq: 10000
eval_episodes: 10
