# PPO learning rate sensitivity sweep

algo: ppo
sweep_param: learning_rate
sweep_values: [1.0e-4, 3.0e-4, 1.0e-3]

hidden_dims: [256, 256]
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
n_epochs: 10
batch_size: 64
rollout_length: 2048
vf_coef: 0.5
ent_coef: 0.0
max_grad_norm: 0.5
total_timesteps: 1000000
eval_freq: 10000
eval_episodes: 10
